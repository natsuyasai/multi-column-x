name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:inject
      - run: npm test
      # Storybook の play function は vitest ブラウザモード(chromium)で実行するため
      # Playwright のブラウザを先に用意する。ブラウザバイナリはキャッシュし、
      # ダウンロードをスキップする(OS依存パッケージのインストールは毎回実行する)。
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:story

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libbz2-dev
      - run: npm ci
      - run: npm run build:inject
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      # tauri.settings.gradle / app/tauri.build.gradle.kts は Tauri が build/dev 時に生成する
      # glue で、gitignore かつローカル絶対パスを含むため CI には無い。
      # ktlint と単体テストはネイティブ(NDK/cargo)非依存なので、APK をビルドせず
      # cargo metadata で得た crate の android プロジェクト位置から glue だけを生成する。
      # ※ android プロジェクトを持つ Tauri プラグインを増減した場合はここも更新すること。
      - name: Generate Tauri Android gradle glue
        run: |
          set -e
          META=$(cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1)
          dir_of() {
            local mp
            mp=$(echo "$META" | jq -r --arg n "$1" '.packages[]|select(.name==$n)|.manifest_path' | head -1)
            echo "${mp%/Cargo.toml}"
          }
          TAURI="$(dir_of tauri)/mobile/android"
          OPENER="$(dir_of tauri-plugin-opener)/android"
          SHELL_DIR="$(dir_of tauri-plugin-shell)/android"
          {
            echo "include ':tauri-android'"
            echo "project(':tauri-android').projectDir = new File('$TAURI')"
            echo "include ':tauri-plugin-opener'"
            echo "project(':tauri-plugin-opener').projectDir = new File('$OPENER')"
            echo "include ':tauri-plugin-shell'"
            echo "project(':tauri-plugin-shell').projectDir = new File('$SHELL_DIR')"
          } > src-tauri/gen/android/tauri.settings.gradle
          # ktlint(.kts) は末尾改行なしを要求するため printf で最終行に改行を付けない。
          printf '%s\n' \
            "val implementation by configurations" \
            "dependencies {" \
            "  implementation(\"androidx.lifecycle:lifecycle-process:2.10.0\")" \
            "  implementation(project(\":tauri-android\"))" \
            "  implementation(project(\":tauri-plugin-opener\"))" \
            "  implementation(project(\":tauri-plugin-shell\"))" \
            > src-tauri/gen/android/app/tauri.build.gradle.kts
          printf '}' >> src-tauri/gen/android/app/tauri.build.gradle.kts
          echo "--- tauri.settings.gradle ---"
          cat src-tauri/gen/android/tauri.settings.gradle
      - name: ktlint & unit tests (app は universal フレーバー必須)
        working-directory: src-tauri/gen/android
        run: |
          chmod +x ./gradlew
          ./gradlew ktlintCheck :app:testUniversalDebugUnitTest
