name: Debug AppImage bundle

# linuxdeploy の失敗原因調査用の一時ワークフロー。調査が終わったら削除する。
on:
  push:
    branches:
      - fix/appimage-linuxdeploy-failure

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libbz2-dev libfdk-aac-dev libopenh264-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools meson ninja-build libva-dev libdrm-dev libgudev-1.0-dev patchelf
      - name: Runner environment
        run: |
          dpkg -l | grep -iE 'gstreamer|libva|openh264|patchelf' | awk '{print $2, $3}'
          ls /usr/lib/x86_64-linux-gnu/gstreamer-1.0 | wc -l
          ls /usr/lib/x86_64-linux-gnu/gstreamer-1.0 | head -200
      - name: Build Linux codec plugins
        run: ./scripts/build-linux-codec-plugins.sh
      - run: npm ci
      - run: npm run build:inject
      - name: Build AppImage (verbose)
        run: npx tauri build --verbose --bundles appimage -c '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee /tmp/tauri-build.log
      - name: Dump AppDir
        if: always()
        run: |
          D=src-tauri/target/release/bundle/appimage/MultiColumnX.AppDir
          ls -la "$D" || true
          find "$D" -maxdepth 4 -type f -name '*.so*' | sort | head -300 || true
          for f in "$D"/usr/lib/libgst*.so* "$D"/usr/lib/gstreamer-1.0/libgstvideoparsersbad.so "$D"/usr/share/multicolumnx/gst-optional/*/*.so*; do
            echo "=== $f"; ldd "$f" 2>&1 | grep -E 'not found|libva|openh264' || true
          done
